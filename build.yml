name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - run: gradle assembleRelease --no-daemon
            - run: gradle assembleRelease --no-daemon --console=plain 2>&1 | tee build.log
        shell: bash
      - name: Show errors
        if: failure()
        run: grep -E -A6 "What went wrong|^e: |error:" build.log | head -40
      - uses: actions/upload-artifact@v4
        with:
          name: SilenceCutter-apk
          path: app/build/outputs/apk/release/*.apk
